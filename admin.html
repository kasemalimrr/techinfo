<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Info Admin</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><div class="logo">TI</div><div><h1>Tech Info Admin</h1><p>News • Photos • Links</p></div></div><a class="admin" href="index.html">View Site</a></header>
<main>
<section class="box"><h2>📰 Add News</h2><form id="newsForm"><input id="newsTitle" placeholder="News title" required><textarea id="newsText" placeholder="News details" required></textarea><button>Add News</button></form><div id="newsList"></div></section>
<section class="box"><h2>🖼️ Add Photo</h2><form id="photoForm"><input id="photoTitle" placeholder="Photo title" required><input id="photoUrl" placeholder="Image URL (https://...)" required><button>Add Photo</button></form><div id="photoList"></div></section>
<section class="box"><h2>🔗 Add Official Website</h2><form id="linkForm"><input id="linkName" placeholder="Website name" required><input id="linkUrl" placeholder="https://example.com" required><button>Add Link</button></form><div id="linkList"></div></section>
</main><script src="admin.js"></script></body></html>
